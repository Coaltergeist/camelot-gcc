name: Repository checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build GCC 2.96
        env:
          NPROC: "2"
        run: bash build.sh gcc296
      - name: Verify compiler provenance
        run: python3 build_manifest.py verify build-296
      - name: Compare compatibility fixtures
        run: python3 tests/run.py
